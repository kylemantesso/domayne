    <!-- XMTP Chat Widget -->
    <script>
      // Inline XMTP Widget - Lightweight version for static HTML
      (function() {
        'use strict';

        let widgetState = {
          isOpen: false,
          sellerConfig: null,
          resolvedSellerAddress: null,
          currentAccount: null,
          error: null,
          chainId: null,
          networkBannerDismissed: false,
          chatState: 'hidden'
        };

        // Configuration discovery
        const discoverSellerConfig = async (domain) => {
          const embeddedConfig = getEmbeddedConfig();
          if (embeddedConfig) return embeddedConfig;

          const urlConfig = getUrlParamsConfig();
          if (urlConfig) return urlConfig;

          try {
            const hostedConfig = await getHostedConfig(domain);
            if (hostedConfig) return hostedConfig;
          } catch (error) {
            console.warn('Failed to fetch hosted config:', error);
          }

          return null;
        };

        const getEmbeddedConfig = () => {
          try {
            const configElement = document.getElementById('xmtp-seller-config');
            if (configElement && configElement.textContent) {
              return JSON.parse(configElement.textContent);
            }
          } catch (error) {
            console.warn('Failed to parse embedded config:', error);
          }
          return null;
        };

        const getUrlParamsConfig = () => {
          const params = new URLSearchParams(window.location.search);
          const seller = params.get('seller');
          if (!seller) return null;

          const isEns = seller.includes('.eth') || seller.includes('.');
          return {
            [isEns ? 'sellerEns' : 'sellerAddress']: seller,
            contactEmail: params.get('contact') || undefined,
            price: params.get('price') || undefined,
            currency: params.get('currency') || undefined,
          };
        };

        const getHostedConfig = async (domain) => {
          const apiUrls = [
            `https://api.yourapp.com/sites/${domain}.json`,
            `/api/domains/${encodeURIComponent(domain)}`,
          ];

          for (const url of apiUrls) {
            try {
              const response = await fetch(url);
              if (response.ok) {
                return await response.json();
              }
            } catch (error) {
              continue;
            }
          }
          return null;
        };

        // Wallet connection
        const connectWallet = async () => {
          if (!window.ethereum) {
            throw new Error('No Ethereum wallet detected. Please install MetaMask or similar wallet.');
          }

          try {
            const accounts = await window.ethereum.request({
              method: 'eth_requestAccounts',
            });
            return accounts[0];
          } catch (error) {
            throw new Error('User rejected wallet connection');
          }
        };

        // Rest of the XMTP widget code would go here...
        // For brevity, I'll include the essential parts

        // Initialize widget
        const initializeWidget = () => {
          // Add chat button
          const targetElement = document.querySelector('.xmtp-chat-target');
          if (targetElement) {
            const button = document.createElement('button');
            button.className = 'xmtp-chat-button';
            button.innerHTML = `
              <svg class="xmtp-chat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px; margin-right: 8px;">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
              </svg>
              Chat with Seller
            `;
            button.style.cssText = `
              display: inline-flex;
              align-items: center;
              background: linear-gradient(135deg, #2563eb, #9333ea);
              color: white;
              padding: 12px 24px;
              border: none;
              border-radius: 50px;
              font-size: 16px;
              font-weight: 600;
              cursor: pointer;
              transition: all 0.3s ease;
              box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
              margin: 8px;
            `;

            button.onclick = () => {
              alert('XMTP Chat Widget Demo\\n\\nIn a full implementation, this would:\\n1. Connect to your wallet\\n2. Initialize XMTP client\\n3. Open a chat with seller.eth\\n4. Support real-time messaging\\n\\nFor now, you can email seller@example.com');
            };

            targetElement.appendChild(button);
          }
        };

        // Auto-initialize
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initializeWidget);
        } else {
          initializeWidget();
        }

      })();
